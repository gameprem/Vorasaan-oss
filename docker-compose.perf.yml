# Query diagnostics for the dev database (ticket 0073; docs/performance.md):
# pg_stat_statements and the slow query log. Use it on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml up -d db
#
# then, once per database: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# (`bun run bench` does that in its own database). Start without this file to turn it off.
services:
  db:
    command:
      - postgres
      # Collects every statement's calls and time (a little overhead; dev and benchmarks only).
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      # The slow query log: every statement slower than this (ms), with its parameters.
      - -c
      - log_min_duration_statement=100
      - -c
      - log_line_prefix=%m [%p] %d %u
      # Lock waits longer than deadlock_timeout (1 s) are logged too.
      - -c
      - log_lock_waits=on
