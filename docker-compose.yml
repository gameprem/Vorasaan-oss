# Run everything:      docker compose up -d          then open http://localhost:3000
# Local development:   docker compose up -d db       (Postgres only; run the apps with bun)
# With 9Router:        docker compose --profile router up -d
#                      then in Vorasaan choose "Custom URL" with http://ninerouter:20128/v1

services:
  db:
    # PostgreSQL 17 with the pgvector extension, for retrieval (ADR 0007).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vorasaan
      POSTGRES_PASSWORD: vorasaan
      POSTGRES_DB: vorasaan
    ports:
      - "${VORASAAN_DB_PORT:-5432}:5432"
    volumes:
      - vorasaan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorasaan"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      DATABASE_URL: postgresql://vorasaan:vorasaan@db:5432/vorasaan
      # Required: the server refuses to start without it. Generate: openssl rand -base64 32
      VORASAAN_SECRET_KEY: ${VORASAAN_SECRET_KEY:-}
      # The web app's public address, for the links on chat app cards.
      VORASAAN_WEB_URL: ${VORASAAN_WEB_URL:-http://localhost:3000}
      # Attachment files: the vorasaan_files volume by default, or any S3-compatible bucket.
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      FILE_STORAGE_LOCAL_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      ATTACHMENT_SNAPSHOT_MAX_CHARS: ${ATTACHMENT_SNAPSHOT_MAX_CHARS:-}
      ATTACHMENT_ALLOW_PRIVATE_URLS: ${ATTACHMENT_ALLOW_PRIVATE_URLS:-false}
    ports:
      - "${VORASAAN_API_PORT:-4000}:4000"
    volumes:
      - vorasaan_files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      VORASAAN_API_URL: http://server:4000
      # Set to true only when serving over plain HTTP on a non-localhost address.
      VORASAAN_INSECURE_COOKIES: ${VORASAAN_INSECURE_COOKIES:-false}
    ports:
      - "${VORASAAN_WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy

  # Optional OpenAI-compatible LLM router (https://github.com/decolua/9router).
  ninerouter:
    image: decolua/9router:latest
    profiles: ["router"]
    ports:
      - "20128:20128"
    volumes:
      - vorasaan_9router:/app/data

volumes:
  vorasaan_pgdata:
  vorasaan_files:
  vorasaan_9router:
