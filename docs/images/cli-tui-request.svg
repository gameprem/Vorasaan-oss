<text x="698.4" y="171.1" fill="#dfe3f0" xml:space="preserve">น</text>
<text x="706.8" y="171.1" fill="#dfe3f0" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">ว่</text>
