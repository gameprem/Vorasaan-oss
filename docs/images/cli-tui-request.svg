<text x="270.0" y="475.1" fill="#dfe3f0" opacity="0.6" textLength="100.8" lengthAdjust="spacing" xml:space="preserve"> Enter open </text>
<text x="370.8" y="475.1" fill="#dfe3f0" opacity="0.6" xml:space="preserve">·</text>
