<text x="93.6" y="57.1" fill="#151827" font-weight="700" textLength="75.6" lengthAdjust="spacing" xml:space="preserve"> 1 Inbox </text>
<text x="169.2" y="57.1" fill="#dfe3f0" textLength="226.8" lengthAdjust="spacing" xml:space="preserve"> 2 My Requests  3 Features </text>
<text x="404.4" y="57.1" fill="#4fd1a1" xml:space="preserve">●</text>
<text x="412.8" y="57.1" fill="#4fd1a1" textLength="42.0" lengthAdjust="spacing" xml:space="preserve"> live</text>
<text x="18.0" y="95.1" fill="#dfe3f0" font-weight="700" textLength="428.4" lengthAdjust="spacing" xml:space="preserve">Who generates the idempotency key for a QR payment?</text>
<text x="18.0" y="114.1" fill="#dfe3f0" textLength="67.2" lengthAdjust="spacing" xml:space="preserve">Blocker </text>
<text x="85.2" y="114.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="93.6" y="114.1" fill="#dfe3f0" textLength="50.4" lengthAdjust="spacing" xml:space="preserve"> Open </text>
<text x="144.0" y="114.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="152.4" y="114.1" fill="#dfe3f0" textLength="739.2" lengthAdjust="spacing" xml:space="preserve"> PromptPay QR payments                                                                  </text>
<text x="18.0" y="133.1" fill="#dfe3f0" textLength="184.8" lengthAdjust="spacing" xml:space="preserve">Raiser: Beam Thongdee </text>
<text x="202.8" y="133.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="211.2" y="133.1" fill="#dfe3f0" textLength="159.6" lengthAdjust="spacing" xml:space="preserve"> Tech Lead decides </text>
<text x="370.8" y="133.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="379.2" y="133.1" fill="#dfe3f0" textLength="512.4" lengthAdjust="spacing" xml:space="preserve"> Decider: Oak Srisuk                                         </text>
<text x="18.0" y="171.1" fill="#dfe3f0" textLength="588.0" lengthAdjust="spacing" xml:space="preserve">We had double payments in UAT when the network dropped after confirm. </text>
<text x="606.0" y="171.1" fill="#dfe3f0" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">ต้</text>
<text x="614.4" y="171.1" fill="#dfe3f0" xml:space="preserve">อ</text>
<text x="622.8" y="171.1" fill="#dfe3f0" xml:space="preserve">ง</text>
