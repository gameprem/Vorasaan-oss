<text x="723.6" y="171.1" fill="#dfe3f0" textLength="42.0" lengthAdjust="spacing" xml:space="preserve"> key </text>
<text x="765.6" y="171.1" fill="#dfe3f0" xml:space="preserve">ม</text>
<text x="774.0" y="171.1" fill="#dfe3f0" xml:space="preserve">า</text>
<text x="782.4" y="171.1" fill="#dfe3f0" xml:space="preserve">จ</text>
<text x="790.8" y="171.1" fill="#dfe3f0" xml:space="preserve">า</text>
