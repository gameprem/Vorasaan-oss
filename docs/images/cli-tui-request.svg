<text x="824.4" y="171.1" fill="#dfe3f0" xml:space="preserve">น</text>
<text x="832.8" y="171.1" fill="#dfe3f0" textLength="58.8" lengthAdjust="spacing" xml:space="preserve">.      </text>
<text x="18.0" y="209.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">Choices                                                                                                 </text>
<text x="18.0" y="228.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">  A. The app, one UUID per confirm tap                                                                  </text>
<text x="18.0" y="247.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">     Simple, and a retry from the app reuses the same key.                                              </text>
<text x="18.0" y="266.1" fill="#dfe3f0" textLength="327.6" lengthAdjust="spacing" xml:space="preserve">     scope: Mobile and the payment API </text>
<text x="345.6" y="266.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="354.0" y="266.1" fill="#dfe3f0" textLength="117.6" lengthAdjust="spacing" xml:space="preserve"> time: +1 day </text>
<text x="471.6" y="266.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="480.0" y="266.1" fill="#dfe3f0" textLength="411.6" lengthAdjust="spacing" xml:space="preserve"> risk: Medium: a reinstalled app or a second     </text>
<text x="18.0" y="285.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">phone can pay twice                                                                                     </text>
<text x="18.0" y="304.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">  B. The server, as a payment intent before confirm                                                     </text>
<text x="18.0" y="323.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">     Create a payment intent when the QR is read; confirm pays that intent at most once.                </text>
<text x="18.0" y="342.1" fill="#dfe3f0" textLength="352.8" lengthAdjust="spacing" xml:space="preserve">     scope: New intent endpoint and table </text>
<text x="370.8" y="342.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="379.2" y="342.1" fill="#dfe3f0" textLength="126.0" lengthAdjust="spacing" xml:space="preserve"> time: +3 days </text>
<text x="505.2" y="342.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="513.6" y="342.1" fill="#dfe3f0" textLength="378.0" lengthAdjust="spacing" xml:space="preserve"> risk: Low                                   </text>
<text x="18.0" y="361.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">  C. A hash of the QR, the account and the minute                                                       </text>
<text x="18.0" y="380.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">     No new state, and duplicates within the same minute are blocked.                                   </text>
<text x="18.0" y="399.1" fill="#dfe3f0" textLength="243.6" lengthAdjust="spacing" xml:space="preserve">     scope: Payment API only </text>
<text x="261.6" y="399.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="270.0" y="399.1" fill="#dfe3f0" textLength="134.4" lengthAdjust="spacing" xml:space="preserve"> time: +0.5 day </text>
<text x="404.4" y="399.1" fill="#dfe3f0" xml:space="preserve">·</text>
<text x="412.8" y="399.1" fill="#dfe3f0" textLength="478.8" lengthAdjust="spacing" xml:space="preserve"> risk: High: two real payments of the same QR in one     </text>
<text x="18.0" y="418.1" fill="#dfe3f0" textLength="873.6" lengthAdjust="spacing" xml:space="preserve">minute are blocked                                                                                      </text>
<text x="18.0" y="437.1" fill="#5fd3e6" textLength="75.6" lengthAdjust="spacing" xml:space="preserve">d decide </text>
<text x="93.6" y="437.1" fill="#5fd3e6" xml:space="preserve">·</text>
<text x="102.0" y="437.1" fill="#5fd3e6" textLength="134.4" lengthAdjust="spacing" xml:space="preserve"> i ask for info </text>
<text x="236.4" y="437.1" fill="#5fd3e6" xml:space="preserve">·</text>
<text x="244.8" y="437.1" fill="#5fd3e6" textLength="100.8" lengthAdjust="spacing" xml:space="preserve"> s reassign </text>
