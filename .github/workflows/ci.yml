name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vorasaan
          POSTGRES_PASSWORD: vorasaan
          POSTGRES_DB: vorasaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vorasaan"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vorasaan:vorasaan@localhost:5432/vorasaan_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:deploy
        working-directory: packages/db
      - run: bun run test
