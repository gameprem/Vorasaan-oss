name: CI

on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vorasaan
          POSTGRES_PASSWORD: vorasaan
          POSTGRES_DB: vorasaan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vorasaan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vorasaan:vorasaan@localhost:5432/vorasaan
      TEST_DATABASE_URL: postgresql://vorasaan:vorasaan@localhost:5432/vorasaan_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run check
